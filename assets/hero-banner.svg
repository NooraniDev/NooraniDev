      <circle cx="976" cy="134" r="4.5" fill="#0D1117" stroke="#58A6FF" stroke-width="1.6" />
      <circle cx="1038" cy="134" r="4.5" fill="#58A6FF" fill-opacity="0.22" stroke="#58A6FF" stroke-width="1.6" />

      <circle cx="1112" cy="104" r="4" fill="#58A6FF" />
      <text x="1072" y="94" fill="#79C0FF">ROBOTICS</text>

      <circle cx="1112" cy="166" r="4" fill="#388BFD" />
