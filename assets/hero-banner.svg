      <stop offset="75%" stop-color="#30363D" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#30363D" stop-opacity="0" />
    </linearGradient>
    <pattern id="subtleGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#161B22" stroke-width="1" />
    </pattern>
    <clipPath id="frameClip">
      <rect width="1200" height="250" rx="12" />
    </clipPath>
  </defs>

