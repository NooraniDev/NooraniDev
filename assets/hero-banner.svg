<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Amirali Noorani — NooraniDev">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="60%" stop-color="#0F1622" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <radialGradient id="blueGlow" cx="84%" cy="42%" r="46%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.14" />
      <stop offset="55%" stop-color="#1F6FEB" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
