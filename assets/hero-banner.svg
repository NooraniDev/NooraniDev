      <path d="M 1038 134 L 1074 104 L 1112 104" stroke="#58A6FF" stroke-opacity="0.55" stroke-width="1.5" />
      <path d="M 1038 134 L 1074 166 L 1112 166" stroke="#388BFD" stroke-opacity="0.45" stroke-width="1.5" />
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">
